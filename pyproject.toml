[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-listing-migration"
version = "0.1.0"
description = "A typed Python media listing migration with queued processing jobs"
requires-python = ">=3.10"
dependencies = ["openai>=1.0", "requests>=2.31", "pydantic>=2.0"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
